[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartnet-bednet-ml"
version = "0.1.0"
description = "Machine learning for bed-net use behaviour classification from accelerometer data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ssemukuye Timothy" }]
keywords = ["machine-learning", "accelerometer", "malaria", "digital-health", "time-series"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0", "ipykernel>=6.25"]
app = ["streamlit>=1.30"]
dhis2 = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
